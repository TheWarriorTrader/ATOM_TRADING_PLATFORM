[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/yourusername/trading-core"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"

# OpenSSL (vendored per evitare dipendenze di sistema)
openssl = { version = "0.10", features = ["vendored"] }

# IB Connection
ibapi = "2.9"

# WebSocket
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
deadpool-postgres = "0.12"

# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"

# Protocol Buffers (for gRPC)
prost = "0.13"
tonic = { version = "0.12", features = ["transport", "codegen"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Configuration
config = "0.15"
arc-swap = "1.7"

# Testing
mockall = "0.13"
proptest = "1.6"

# Tracing and logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
tracing-appender = "0.2"

# Metrics
prometheus = "0.13"
lazy_static = "1.5"

# Utilities
uuid = { version = "1.11", features = ["serde", "v4"] }
rust_decimal = { version = "1.36", features = ["serde"] }
dashmap = "6.1"
flume = "0.11"
parking_lot = "0.12"
once_cell = "1.20"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Indicators (optional)
ta = "0.5"
yata = "0.7"

# Internal dependencies
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-with-debug]
inherits = "release"
strip = false
